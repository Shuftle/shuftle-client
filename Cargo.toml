[package]
name = "shuftle-client-core"
version = "0.3.0"
edition = "2024"
authors = ["Sebastiano Giordano"]
categories = ["game-development"]
description = "A collection of classical card games"
keywords = ["cards", "card_games"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/shuftle/shuftle-client"

[workspace]
members = ["mobile"]

[workspace.dependencies]
# Shared so a Bevy upgrade is a single change for every platform.
bevy = { version = "0.20", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "shuftle"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["2d", "ui"] }
rand = "0.10"
shuftlib = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# Faster incremental builds for local development: `cargo run --features dev`.
# Never ship with it: the binary then needs Bevy's shared library next to it.
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
