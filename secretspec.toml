[project]
name = "shuftle"
revision = "1.0"

# Release secrets, by consumer. To build a signed Android release locally:
# `secretspec run --scope android -- ./gradlew bundleRelease` in android/.
[profiles.production]
ANDROID_KEYSTORE_BASE64 = { description = "Upload keystore (.jks), base64-encoded", required = true }
ANDROID_KEYSTORE_PASSWORD = { description = "Upload keystore password", required = true }
ANDROID_KEY_ALIAS = { description = "Upload key alias", default = "upload" }
ANDROID_KEY_PASSWORD = { description = "Upload key password", required = true }
BUTLER_API_KEY = { description = "itch.io butler API key" }

[scopes.android]
secrets = ["ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]

[scopes.itch]
secrets = ["BUTLER_API_KEY"]
