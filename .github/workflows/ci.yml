name: Rust CI

on:
  pull_request:
    branches:
      - main
  # Runs after each merge so PRs can restore caches saved on main.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI only checks and tests: skip the debug info and dependency optimisation
  # local dev builds want, as they only slow down compiling Bevy.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  nightly-test:
    name: Test with nightly
    runs-on: ubuntu-latest
    # Early warning only: nightly breakage should not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --workspace --config 'profile.dev.package."*".opt-level = 0'

  test:
    name: Test with stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --workspace --config 'profile.dev.package."*".opt-level = 0'

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linting
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  wasm:
    name: Wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linting
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  dependencies:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Machete
        uses: bnjbvr/cargo-machete@v0.9.2

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      # Same as the test jobs: CI only checks that the app builds.
      - name: Skip optimising dependencies
        run: printf '[profile.dev.package."*"]\nopt-level = 0\n' >> ~/.cargo/config.toml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper checked into the repo.
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        # The versions come from the Gradle version catalog, as in flake.nix.
        run: |
          read -r compile_sdk build_tools ndk < <(python3 -c '
          import tomllib
          v = tomllib.load(open("android/gradle/libs.versions.toml", "rb"))["versions"]
          print(v["androidCompileSdk"], v["androidBuildTools"], v["androidNdk"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$compile_sdk" "build-tools;$build_tools" "ndk;$ndk" > /dev/null
          # The runner presets ANDROID_NDK_ROOT to its default NDK: point both at ours.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug
