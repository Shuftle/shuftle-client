name: Release

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Rebuilds and re-uploads the release of an existing tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag being released.
  VERSION: ${{ inputs.version || github.ref_name }}
  binary: shuftle
  add_binaries_to_github_release: true
  itch_target: krahos/shuftle

  use_git_lfs: false

jobs:
  # Build for wasm
  release-wasm:
    runs-on: ubuntu-latest
    permissions:
      # Uploads the build to the GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}
          lfs: ${{ env.use_git_lfs }}
          persist-credentials: false
      - name: Download assets
        run: |
          mkdir -p assets
          sudo apt-get update && sudo apt-get install -y megatools
          megatools dl --path assets https://mega.nz/folder/DOZ1HCTb#sD5HuQYbZpOx2hS0apSXhQ
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli
        run: |
          version=$(cargo metadata --format-version 1 | jq --raw-output '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install -f wasm-bindgen-cli --version "$version"

      - name: Build
        run: |
          cargo build --locked --profile wasm-release --target wasm32-unknown-unknown

      - name: Prepare package
        run: |
          wasm-bindgen --no-typescript --out-name bevy_game --out-dir wasm --target web target/wasm32-unknown-unknown/wasm-release/${{ env.binary }}.wasm
          cp -r assets wasm/ || true # Try to copy, but ignore if it can't copy if source directory does not exist

      - name: Optimize wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: wasm/bevy_game_bg.wasm

      - name: Package as a zip
        working-directory: ./wasm
        run: |
          zip --recurse-paths ../${{ env.binary }}.zip .

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.binary }}.zip
          name: wasm
          retention-days: 1

      - name: Upload binaries to release
        if: ${{ env.add_binaries_to_github_release == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}.zip
          asset_name: ${{ env.binary }}-wasm-${{ env.VERSION }}.zip
          tag: ${{ env.VERSION }}
          overwrite: true

  upload-to-itch:
    runs-on: ubuntu-latest
    needs: release-wasm

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: ./builds/wasm

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          for dir in builds/*/; do
            channel=$(basename "$dir")
            ./butler push \
                --fix-permissions \
                --userversion="$VERSION" \
                "$dir"* \
                "$itch_target:$channel"
          done
